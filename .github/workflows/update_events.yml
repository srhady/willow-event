name: Live Sports Event Generator

on:
  workflow_dispatch:

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/axsportspvt
          token: ${{ secrets.PAT_TOKEN }}
          path: private_repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pywidevine requests typing_extensions

      - name: Run Generator Scripts
        run: |
          cp private_repo/willow_generator.py .
          cp private_repo/primevideo_sports.py .
          cp private_repo/device.wvd .
          python willow_generator.py
          python primevideo_sports.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live_sports.json live_sports.m3u primevideo_sports.json primevideo_sports.m3u
          git commit -m "Auto-update Willow and Prime Video live events" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main
